# xdg-desktop-portal backends for the Veil session (XDG_CURRENT_DESKTOP=Veil:XFCE).
# GTK provides file choosers (used by Tor Browser's Flatpak), wlr provides
# screenshots/screencast with an explicit chooser.
[preferred]
default=gtk
org.freedesktop.impl.portal.Screenshot=wlr
org.freedesktop.impl.portal.ScreenCast=wlr
