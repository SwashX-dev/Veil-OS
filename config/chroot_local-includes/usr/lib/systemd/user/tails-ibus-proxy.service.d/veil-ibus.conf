# Veil OS: under GNOME, GNOME Shell starts the IBus daemon
# (org.freedesktop.IBus.session.GNOME.service). In the Veil session the
# generic IBus service must be started instead, otherwise
# tails-ibus-proxy fails and Tor Connection (tca.service, which Requires=
# it) never starts. The generic unit refuses to run under GNOME itself.
[Unit]
Wants=org.freedesktop.IBus.session.generic.service
After=org.freedesktop.IBus.session.generic.service
