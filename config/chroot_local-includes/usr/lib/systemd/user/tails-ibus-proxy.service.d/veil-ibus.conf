# Veil OS: under GNOME, GNOME Shell starts the IBus daemon. The Veil session
# starts it from its autostart (the generic IBus systemd unit cannot be used:
# it shares BusName= with the GNOME unit, which systemd refuses to load).
# Wait until the daemon publishes its address, otherwise tails-ibus-proxy
# fails and Tor Connection (tca.service, which Requires= it) never starts.
[Service]
ExecStartPre=/bin/sh -c 'for i in $(seq 1 100); do /usr/bin/ibus address | grep -q "^unix:" && exit 0; sleep 0.2; done; exit 0'
