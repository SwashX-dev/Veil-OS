# This hides the 'tails' Flatpak installation from GNOME
# Software. Apparently our pseudo-Flatpaks from that installation have
# invalid metadata in such a way that GNOME Software 51.x will reject
# _all_ metadata, including what it gets from Flathub, resulting in
# (at least) that descriptions are NULL which leads to nothing being
# listed in the 'Installed' tab.
[Service]
Environment=FLATPAK_CONFIG_DIR=/dev/null
