# Veil OS Nix configuration (single-user; runs as the live user).
# All downloads are plain TCP connections from the live user and are
# therefore routed through Tor by the unchanged Tails firewall.
experimental-features = nix-command flakes
substituters = https://cache.nixos.org
trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=
require-sigs = true
build-users-group =
sandbox = true
use-xdg-base-directories = true
auto-optimise-store = false
# Tor circuits are slow; be patient and resilient.
connect-timeout = 60
download-attempts = 5
stalled-download-timeout = 300
http-connections = 8
# Never phone home.
accept-flake-config = false
warn-dirty = false
